<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف - Helana & Safwat</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #fdfaf6;
            color: #4a4a4a;
            margin: 0;
            padding: 20px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }
        .card {
            background: #ffffff;
            padding: 40px 25px;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            max-width: 420px;
            width: 88%;
            border: 1px solid #e8e0d5;
        }
        .cross {
            font-size: 1.8rem;
            color: #b89758;
            margin-bottom: 5px;
        }
        h1 {
            font-family: 'Amiri', serif;
            color: #b89758;
            font-size: 2.2rem;
            margin: 10px 0;
        }
        .verse {
            font-family: 'Amiri', serif;
            font-size: 1.15rem;
            color: #666;
            font-style: italic;
            margin: 15px 0 25px 0;
            line-height: 1.6;
        }
        .names {
            font-family: 'Amiri', serif;
            font-size: 2.2rem;
            color: #2c3e50;
            font-weight: bold;
            margin: 20px 0;
            letter-spacing: 1px;
        }
        .and-symbol {
            color: #b89758;
            font-size: 1.8rem;
        }
        .details {
            background-color: #fcf8f2;
            padding: 20px 15px;
            border-radius: 15px;
            border: 1px dashed #d4c4ab;
            margin-top: 25px;
        }
        .details p {
            margin: 10px 0;
            font-size: 1.05rem;
        }
        .btn-map {
            display: inline-block;
            margin-top: 25px;
            padding: 14px 28px;
            background-color: #b89758;
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            font-size: 1.05rem;
            box-shadow: 0 4px 15px rgba(184, 151, 88, 0.35);
            transition: background-color 0.3s;
        }
        .btn-map:hover {
            background-color: #a08246;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="cross">☦</div>
        <h1>دعوة إكليل</h1>
        <p class="verse">"فَالَّذِي جَمَعَهُ اللهُ لاَ يُفَرِّقُهُ إِنْسَانٌ"<br><small>(متى 19: 6)</small></p>
        
        <p>يتشرفون بدعوتكم لحضور حفل الزفاف المبارك</p>
        
        <div class="names">
            Safwat <span class="and-symbol">&</span> Helana
        </div>

        <div class="details">
            <p>🗓️ <strong>التاريخ:</strong> السبت، 23 يناير 2027</p>
            <p>⏰ <strong>التوقيت:</strong> الساعة 7:00 مساءً</p>
            <p>📍 <strong>المكان:</strong> كنيسة الشهيد العظيم أبوسيفين بفيديمين</p>
        </div>

        <a href="https://maps.app.goo.gl/sQea8WUtUdKar1aP8" target="_blank" class="btn-map">🗺️ موقع الكنيسة على الخريطة</a>
    </div>
</body>
</html>
